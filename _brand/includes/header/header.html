<header lang="en" class="arka__site-header py-4 d-none d-md-block">
  <div class="container">
    <a href="{{ site.baseurl }}/"
       class="d-flex justify-content-center text-decoration-none">
      <svg class="arka__logo icon-lg">
        <title>{{ site.title }}</title>
        <use href="#icon-ark"></use>
      </svg>
      <div>
        <div class="arka__title display-1 mb-0">
          {{ site.title }}
        </div>
        <p class="arka__tagline mb-0">
          {{ site.tagline }}
        </p>
      </div>
    </a>
  </div>
</header>
