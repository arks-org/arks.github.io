name: Jekyll Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --destination _site

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
